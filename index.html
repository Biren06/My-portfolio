<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Biren Badrakiya | Junior Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Biren Badrakiya, a final-year Computer Engineering student with hands-on experience in DevOps, cloud-native workflows, and full-stack development using JavaScript, React, Node.js, Docker, and SQL databases." />

    <!-- Open Graph -->
    <meta property="og:title" content="Biren Badrakiya | Junior Full-Stack Developer" />
    <meta property="og:description" content="Portfolio of Biren Badrakiya, a final-year Computer Engineering student with hands-on experience in DevOps, cloud-native workflows, and full-stack development using JavaScript, React, Node.js, Docker, and SQL databases." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/profile.jpg" />

    <!-- Early Theme Initialization to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
